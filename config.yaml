# 个人财富管理配置器 · 配置文件
# 改这里即可调整资产池和优化规则，不用动代码

risk_free_rate: 0.02        # 无风险利率（年化）
weight_cap: 0.4             # 单资产默认权重上限（KYC 定级后会再收紧）
shrinkage: true             # 协方差矩阵 Ledoit-Wolf 收缩
monte_carlo_paths: 2000     # 蒙特卡洛模拟路径数
mc_method: bootstrap        # 蒙特卡洛方法：bootstrap=历史残差自助法(肥尾) / gbm=正态假设
jump_sigma: 5               # 数据质量：单日涨跌超过 N 倍波动率视为跳跃
missing_warn_ratio: 0.05    # 数据质量：缺失交易日占比超过该值时提示
trade_cost_bps: 5           # 单边交易成本（万分之 5，回测/调仓估算用）
bl_tau: 0.05                # Black-Litterman 先验缩放系数
bl_view_shrink: 0.5         # 择时观点强度：跌破均线的资产预期收益向无风险利率收缩的比例
alphavantage_api_key: ""    # 可选：Alpha Vantage 免费 key（alphavantage.co 注册），填后作为美股最后备用源

# 主流机构观点快照（人工整理，非实时数据；更新日期见 updated 字段）
# 来源：公开报道的高盛/摩根士丹利/摩根大通/瑞银等 2026 年展望
market_views:
  updated: "2026年9月（人工整理快照，非实时）"
  items:
    - 美股：高盛预计 2026 年标普500 EPS 约 340 美元（同比 +24%），认为上涨由盈利驱动而非估值扩张；摩根士丹利全球投资委员会超配股票，看 11~12% 上行空间
    - 美股风险：嘉信理财中期展望提示——通胀黏性、实际工资负增长、霍尔木兹海峡局势推高能源价格，可能压制消费板块
    - 中国：高盛看 MSCI 中国到 2026 年底约 +20%、沪深300 目标 5200 点，逻辑是 AI 提效 + 政策支持带动盈利加速（2026-27 盈利增速约 14% vs 2025 约 4%）；风险在内需、地产与地缘
    - 黄金：央行购金仍是核心支撑，主要投行 2026 年底目标价集中在 4800~6300 美元/盎司（高盛 5400、摩根大通 6300、瑞银 5600~5900），但瑞银提示"最容易赚的钱已经赚完"
    - 大宗商品：铜的结构性缺口共识强（目标约 11000 美元/吨，AI 数据中心+电网需求）；原油则普遍被认为供给充足，摩根大通年底看 78 美元、高盛 85 美元
    - 使用建议：机构观点经常错，这里只是"当前市场共识在哪里"的参照系，用于对照你的风险归因结果（比如你的组合风险集中在黄金时，看看机构对黄金的分歧）

# 压力测试情景（用真实历史区间重放）
stress_scenarios:
  - name: 2020年3月疫情崩盘
    start: "2020-02-19"
    end: "2020-03-23"
  - name: 2022年股债双杀
    start: "2022-01-03"
    end: "2022-10-24"
  - name: 2025年4月关税冲击
    start: "2025-04-02"
    end: "2025-04-08"

# ---------- 模式二资产池 ----------
# 字段：ticker 代码 / name 具体产品名 / desc 一句话说明 / role 角色
#   role ∈ equity(股票) bond(债券) gold(黄金) commodity(商品) hedge(对冲) cash(现金类)
#   risk = 产品风险等级 R1(低)~R5(高)，用于 KYC 适当性匹配
#   fee  = 年管理费率（约值，供费用估算）
#   exp_return 可选：前瞻性年化收益假设，覆盖历史均值（Black-Litterman 之前的基准）

